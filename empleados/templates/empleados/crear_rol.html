{% extends 'main.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/crear_rol.css' %}">
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="mb-4 text-center">Crear Nuevo Rol</h2>
        <form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label for="nombre">Nombre del rol</label>
        <input type="text" class="form-control" name="nombre" required>
    </div>

    <div class="mb-3">
        <label>Privilegios</label><br>

        {% for privilegio in privilegios %}
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="privilegios" value="{{ privilegio.privilegio_nombre }}" id="priv-{{ privilegio.privilegio_id }}">
                <label class="form-check-label" for="priv-{{ privilegio.privilegio_id }}">
                    {{ privilegio.privilegio_nombre|capfirst }}
                </label>
            </div>
        {% empty %}
            <p class="text-danger">No hay privilegios registrados en la base de datos.</p>
        {% endfor %}

    </div>

    <button type="submit" class="btn btn-primary">Crear Rol</button>
</form>
    </div>
</div>
{% endblock %}
