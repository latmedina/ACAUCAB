<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden de Compra</title>
    <!-- Incluir la librería de Handlebars -->
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; font-size: 14px; color: #333; margin: 0; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 800px; margin: auto; background-color: #fff; padding: 30px; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        .header-section { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .company-info { text-align: left; }
        .right-column { text-align: right; }
        .company-info h2 { margin-top: 0; }
        .main-title { font-size: 28px; font-weight: bold; color: #1a237e; margin: 0; white-space: nowrap; margin-bottom: 15px; }
        .company-info p, .order-info p { margin: 0; line-height: 1.8; }
        .order-info span { display: inline-block; border-bottom: 1px solid #333; min-width: 100px; margin-left: 10px; padding: 0 5px;}
        .section { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .provider-info { border: 1px solid #ccc; padding: 15px; border-radius: 5px; display: flex; justify-content: space-between; }
        .provider-info > div { width: 48%; }
        .provider-info p { margin: 5px 0; display: flex; justify-content: space-between; }
        .provider-info span { border-bottom: 1px solid #333; flex-grow: 1; margin-left: 10px; padding: 0 5px;}
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        th, td { border: 1px solid #000; padding: 5px; text-align: left; }
        th { background-color: #f2f2f2; font-weight: bold; }
        .col-id { width: 10%; }
        .col-name { width: 45%; }
        .col-qty, .col-price, .col-total { width: 15%; text-align: right; }
        .totals-section { display: flex; justify-content: space-between; margin-top: 10px; }
        .notes-box { border: 1px solid #000; padding: 10px; width: 50%; min-height: 100px; }
        .totals-table { width: 45%; text-align: right; }
        .totals-table p { margin: 10px 0; display: flex; justify-content: space-between; }
        .totals-table span { border-bottom: 1px solid #333; min-width: 80px; text-align: right; padding: 0 5px; }
        .totals-table strong { margin-right: 15px; }
        .signatures { margin-top: 30px; display: flex; justify-content: space-around; }
        .signature-box { text-align: center; width: 40%; }
        .signature-box p { border-top: 1px solid #333; padding-top: 8px; margin-top: 40px; }
    </style>
</head>
<body>
    
    <!-- El contenedor donde se renderizará el reporte -->
    <div id="reporte-container">
        <p style="text-align: center; font-size: 1.2rem; padding: 50px;">Cargando orden de compra...</p>
    </div>

    <!-- 
        PLANTILLA HANDLEBARS
        Se envuelve en {% verbatim %} para que Django no la procese.
    -->
    {% verbatim %}
    <script id="plantilla-orden" type="text/x-handlebars-template">
    <div class="container">
        <div class="header-section">
            <div class="company-info">
                <h2>ACAUCAB</h2>
                <p>Asociación de Cerveceros Artesanales de la UCAB</p>
                <p>Final Avenida Teherán, Montalbán, Caracas, Distrito Capital, Venezuela.</p>
                <p>Código postal: 1020</p>
                <p>Tlf: 0412-1234567</p>
            </div>
            <div class="right-column">
                <h1 class="main-title">ORDEN DE COMPRA</h1>
                <div class="order-info">
                    <p>Fecha <span>{{orden_info.fecha}}</span></p>
                    <p>No. de orden <span>{{orden_info.id}}</span></p>
                </div>
            </div>
        </div>
        
        <div class="section provider-info">
            <div class="proveedor">
                <strong>Proveedor</strong>
                <p>Compañía<span>{{proveedor_info.nombre}}</span></p>
                <p>Teléfono<span>{{proveedor_info.telefono}}</span></p>
                <p>Dirección<span>{{proveedor_info.direccion}}</span></p>
            </div>
            <div class="enviar-a">
                <strong>Enviar a</strong>
                <p>Local<span>{{enviar_a_info.local}}</span></p>
                <p>Teléfono<span>{{enviar_a_info.telefono}}</span></p>
                <p>Dirección<span>{{enviar_a_info.direccion}}</span></p>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th class="col-id">ID</th>
                    <th class="col-name">Nombre del producto</th>
                    <th class="col-qty">Cantidad</th>
                    <th class="col-price">Precio unitario</th>
                    <th class="col-total">Total</th>
                </tr>
            </thead>
            <tbody>
                {{#each detalles}}
                <tr>
                    <td>{{id}}</td>
                    <td>{{producto}}</td>
                    <td style="text-align: right;">{{cantidad}}</td>
                    <td style="text-align: right;">{{formatCurrency precio_unitario}}</td>
                    <td style="text-align: right;">{{formatCurrency total_linea}}</td>
                </tr>
                {{/each}}
            </tbody>
        </table>

        <div class="totals-section">
            <div class="notes-box">
                <strong>Notas / Observaciones</strong>
                <div></div>
            </div>
            <div class="totals-table">
                <p><strong>SUBTOTAL</strong> <span>{{formatCurrency totales.subtotal}}</span></p>
                <p><strong>TOTAL IMPUESTOS (16%)</strong> <span>{{formatCurrency totales.impuestos}}</span></p>
                <p><strong>TOTAL</strong> <span>{{formatCurrency totales.total}}</span></p>
            </div>
        </div>

        <footer class="signatures">
            <div class="signature-box">
                <p>Autorizado por</p>
            </div>
            <div class="signature-box">
                <p>Firma</p>
            </div>
        </footer>
    </div>
    </script>
    {% endverbatim %}

    <!-- Se pasan los datos de forma segura usando el filtro |json_script -->
    {{ report_data|json_script:"orden-data-json" }}

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Helper para formatear moneda
        Handlebars.registerHelper('formatCurrency', function(value) {
            if (typeof value !== 'number') value = parseFloat(value);
            return value ? '$' + value.toFixed(2) : '$0.00';
        });

        const container = document.getElementById('reporte-container');
        
        try {
            // Se obtienen los datos del script tag que Django generó
            const dataElement = document.getElementById('orden-data-json');
            const reportData = JSON.parse(dataElement.textContent);
            
            // Se compila y renderiza la plantilla
            const templateHtml = document.getElementById('plantilla-orden').innerHTML;
            const template = Handlebars.compile(templateHtml);
            container.innerHTML = template(reportData);

        } catch (error) {
            console.error('Error al renderizar la orden:', error);
            container.innerHTML = `<p style="color: red; text-align: center;">Ocurrió un error al mostrar la orden de compra.</p>`;
        }
    });
    </script>
</body>
</html>
