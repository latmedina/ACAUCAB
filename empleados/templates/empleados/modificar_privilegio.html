{% extends 'main.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Modificar Privilegio</h2>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="privilegio_nombre" class="form-label">Nombre del Privilegio</label>
            <input type="text" class="form-control" id="privilegio_nombre" name="privilegio_nombre" value="{{ privilegio.privilegio_nombre }}" required>
        </div>

        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        <a href="{% url 'empleados:listar_privilegios' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
