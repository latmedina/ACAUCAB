{% extends 'empleados/base_empleados.html' %}

{% block title %}Asignar Rol{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-warning text-white">
        <h4><i class="fas fa-user-cog me-2"></i>Asignar Rol a Usuario</h4>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.usuario.label_tag }}
                {{ form.usuario }}
            </div>
            <div class="mb-3">
                {{ form.rol.label_tag }}
                {{ form.rol }}
            </div>
            <button type="submit" class="btn btn-warning">
                <i class="fas fa-check me-2"></i>Asignar Rol
            </button>
        </form>
    </div>
</div>
{% endblock %}
