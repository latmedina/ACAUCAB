{% extends "main.html" %}
{% load static %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg p-4">
            <h2 class="text-center mb-4">Iniciar Sesión</h2>
            {% if error %}
                <div class="alert alert-danger text-center">{{ error }}</div>
            {% endif %}
            <form method="POST" novalidate>
                {% csrf_token %}
                <div class="form-group mb-3">
                    <label for="username">Usuario</label>
                    <input type="text" name="username" id="username" class="form-control" required autofocus>
                </div>
                <div class="form-group mb-4">
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                </div>
                <div class="d-grid mb-2">
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </div>
            </form>
            <div class="d-grid gap-2">
                <label for="tipo-registro" class="form-label">¿Cómo deseas registrarte?</label>
                <select id="tipo-registro" class="form-select mb-2" onchange="redirigirRegistro(this)">
                    <option selected disabled>Selecciona una opción</option>
                    <option value="{% url 'registrar_cliente' %}">Cliente</option>
                    <option value="{% url 'registrar_proveedor' %}">Proveedor</option>
                    <option value="{% url 'registrar_empleado' %}">Empleado</option>
                </select>
            </div>
        </div>
    </div>
</div>

<script>
    function redirigirRegistro(select) {
        const url = select.value;
        if (url) {
            window.location.href = url;
        }
    }
</script>

{% endblock %}
