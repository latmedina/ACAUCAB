{% extends 'main.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" type="text/css" href="{% static 'css/promociones.css' %}">

<div class="main-content">
    <div class="promotion-header">
        <div class="promotion-title">
            <h2>Promoción 1</h2>
            <svg class="edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="m18.5 2.5 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            <button class="save-btn">Guardar Promoción</button>
        </div>
        <div class="promotion-dropdown">
            <div class="dropdown-container">
                {% for promotion in promotions %}
                <div class="dropdown-item {% if forloop.first %}first-child{% endif %}" data-promotion-id="{{promotion.id}}">
                    {{promotion.name}}
                    {% if forloop.first %}<span>▲</span>{% endif %}
                </div>
                {% empty %}
                <div class="dropdown-item first-child">
                    Sin promociones
                    <span>▲</span>
                </div>
                {% endfor %}
                <div class="dropdown-item" onclick="promotionManager.createNewPromotion()">+ Nueva promoción</div>
            </div>
        </div>
    </div>

    <div class="form-section">
        <div class="form-group">
            <label>Tipo</label>
            <div class="select-wrapper">
                <select class="form-control" name="discount_type">
                    <option value="porcentual">Porcentual</option>
                    <option value="fijo">Fijo</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Monto</label>
            <input type="number" class="form-control" name="discount_amount" value="20" min="0" step="0.01">
        </div>
        <div class="form-group">
            <label>Inicio</label>
            <div class="select-wrapper">
                <input type="date" class="form-control" name="start_date">
            </div>
        </div>
        <div class="form-group">
            <label>Fin</label>
            <div class="select-wrapper">
                <input type="date" class="form-control" name="end_date">
            </div>
        </div>
        <div class="form-group">
            <label>Estatus</label>
            <div class="select-wrapper">
                <select class="form-control" name="status">
                    <option value="inactivo">Inactivo</option>
                    <option value="activo">Activo</option>
                </select>
            </div>
        </div>
    </div>

    <div class="products-section">
        <h3 class="products-title">Productos con descuento</h3>
        <div class="products-grid">
            <div class="add-product">
                <div class="add-icon">+</div>
                <div class="add-text">Agregar</div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/promociones.js' %}"></script>
{% endblock content %}
