<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Incumplimiento Horario</title>
    <!-- Incluir la librería de Handlebars -->
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; color: #343a40; }
        .report-container { max-width: 1100px; margin: auto; background-color: #fff; padding: 30px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); border-radius: 8px; }
        .report-header { text-align: center; border-bottom: 2px solid #dee2e6; padding-bottom: 20px; margin-bottom: 30px; }
        .report-header h1 { color: #dc3545; margin: 0; }
        .report-header p { margin: 5px 0 0; font-size: 1rem; color: #6c757d; }
        .filters { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; align-items: center; }
        .filters label { font-weight: bold; }
        .filters input[type="date"] { padding: 8px; border: 1px solid #ced4da; border-radius: 4px; }
        .filters button { padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .employee-section { margin-bottom: 25px; }
        .employee-header { background-color: #f8f9fa; border: 1px solid #dee2e6; padding: 12px 15px; border-radius: 6px; font-weight: bold; font-size: 1.2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: left; }
        th { background-color: #343a40; color: white; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        .no-data { text-align: center; padding: 40px; background-color: #f8f9fa; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="report-container">
        <header class="report-header">
            <h1>Reporte de Incumplimiento Horario</h1>
            <p>Detalle de llegadas tardes y salidas tempranas por empleado</p>
        </header>

        <!-- Filtros de fecha -->
        <div class="filters">
            <label for="fecha_inicio">Desde:</label>
            <input type="date" id="fecha_inicio">
            <label for="fecha_fin">Hasta:</label>
            <input type="date" id="fecha_fin">
            <button id="generarBtn">Generar Reporte</button>
        </div>

        <!-- Contenedor para los resultados -->
        <div id="reporte-content">
            <p class="no-data">Seleccione un rango de fechas para ver los incumplimientos.</p>
        </div>
    </div>

    <!-- 
        PLANTILLA HANDLEBARS PARA EL REPORTE DE INCUMPLIMIENTOS
        Envuelta en {% verbatim %} para que Django no la procese.
    -->
    {% verbatim %}
    <script id="plantilla-reporte" type="text/x-handlebars-template">
        {{#if this.length}}
            {{#each this}}
            <div class="employee-section">
                <div class="employee-header">{{empleado_nombre}} (ID: {{empleado_id}})</div>
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Tipo de Incumplimiento</th>
                            <th>Detalle</th>
                            <th>Duración (HH:MI:SS)</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{#each incumplimientos}}
                        <tr>
                            <td>{{fecha}}</td>
                            <td>{{tipo}}</td>
                            <td>{{detalle}}</td>
                            <td>{{duracion}}</td>
                        </tr>
                        {{/each}}
                    </tbody>
                </table>
            </div>
            {{/each}}
        {{else}}
            <p class="no-data">No se encontraron incumplimientos para el período seleccionado.</p>
        {{/if}}
    </script>
    {% endverbatim %}

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const generarBtn = document.getElementById('generarBtn');
        const contentContainer = document.getElementById('reporte-content');
        const templateHtml = document.getElementById('plantilla-reporte').innerHTML;
        const template = Handlebars.compile(templateHtml);

        async function generarReporte() {
            const fechaInicio = document.getElementById('fecha_inicio').value;
            const fechaFin = document.getElementById('fecha_fin').value;

            if (!fechaInicio || !fechaFin) {
                contentContainer.innerHTML = '<p class="no-data" style="color: red;">Por favor, seleccione ambas fechas.</p>';
                return;
            }

            contentContainer.innerHTML = '<p class="no-data">Cargando datos...</p>';

            try {
                // Construye la URL del API con los parámetros de fecha
                const apiUrl = `/api/reportes/incumplimiento-horario/?inicio=${fechaInicio}&fin=${fechaFin}`;
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: No se pudieron obtener los datos.`);
                }
                const data = await response.json();
                
                // Renderiza la plantilla con los datos y la muestra
                contentContainer.innerHTML = template(data);

            } catch (error) {
                console.error('Error al generar el reporte:', error);
                contentContainer.innerHTML = `<p class="no-data" style="color: red;"><strong>Error:</strong> ${error.message}</p>`;
            }
        }

        if (generarBtn) {
            generarBtn.addEventListener('click', generarReporte);
        }
    });
    </script>
</body>
</html>
