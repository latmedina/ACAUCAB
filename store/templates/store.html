{% extends "main.html" %}
{% block content %}
<div class="row">
    {% for product in products %}
    <div class="col-lg-4">
        {% if product.prese_imagen %}
        <img class="thumbnail" src="{{ product.prese_imagen.url }}">
        {% endif %}
        <div class="box-element product">
            <h6><strong>{{ product.prese_nombre }}</strong></h6>
            <hr>
            <button data-product="{{ product.prese_id }}" data-action="add" class="btn btn-outline-secondary update-cart">Agregar al carrito</button>
            <h4 style="float: right"><strong>${{ product.precio_actual }}</strong></h4>
        </div>
    </div>
    {% empty %}
    <p>No hay productos disponibles.</p>
    {% endfor %}
</div>
{% endblock %}
