{% extends 'main.html' %}
{% block content %}
<h2>Modificar Usuario</h2>
<form method="POST">
    {% csrf_token %}
    
    <label for="username">Nombre de usuario:</label>
    <input type="text" name="username" id="username" value="{{ usuario.username }}" required><br>

    <label for="email">Correo electrónico:</label>
    <input type="email" name="email" id="email" value="{{ usuario.email }}" required><br>

    <label for="first_name">Nombre:</label>
    <input type="text" name="first_name" id="first_name" value="{{ usuario.first_name }}" required><br>

    <label for="last_name">Apellido:</label>
    <input type="text" name="last_name" id="last_name" value="{{ usuario.last_name }}" required><br>

    <label for="password">Nueva contraseña (dejar en blanco si no desea cambiarla):</label>
    <input type="password" name="password" id="password"><br>

    <button type="submit">Guardar Cambios</button>
</form>
{% endblock %}
